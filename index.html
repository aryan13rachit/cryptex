<!doctype html>
<html lang="en" data-theme="detective">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cryptex</title>
  <meta name="description" content="Vintage cipher & signals toolkit: Caesar, Vigenère, Enigma, Morse, light-beam Morse, SSTV, sound paper and more.">
  <meta name="theme-color" content="#2a1c12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/theme-detective.css">
  <link rel="stylesheet" href="css/theme-radio.css">
</head>
<body>
  <!-- Rough-ink filter used for rubber-stamp effects in the detective theme -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="rough-ink">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feComponentTransfer in="noise" result="holes"><feFuncA type="discrete" tableValues="1 1 1 0.35 1 1"/></feComponentTransfer>
      <feComposite in="d" in2="holes" operator="in"/>
    </filter>
  </svg>

  <div id="app">
    <header class="topbar">
      <button class="icon-btn back" id="back" aria-label="Back to home" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <a class="brand" href="#/">
        <span class="brand-name">CRYPTEX</span>
        <span class="brand-sub" id="brand-sub"></span>
      </a>
      <span class="power-led" aria-hidden="true"></span>
      <button class="icon-btn theme-btn" id="theme-btn" aria-label="Switch interface style" title="Switch interface style">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M12 4a8 8 0 0 1 0 16"/></svg>
      </button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <div id="picker" class="picker" hidden>
    <div class="picker-inner">
      <h1 class="picker-title">Choose your interface</h1>
      <p class="picker-sub">You can switch at any time with the button in the top corner.</p>
      <button class="pick pick-detective" data-pick="detective">
        <span class="pick-tab">CASE FILE</span>
        <span class="pick-name">The Detective's Desk</span>
        <span class="pick-desc">Manila folders, typewriter ink and rubber stamps.</span>
        <span class="pick-stamp">CLASSIFIED</span>
      </button>
      <button class="pick pick-radio" data-pick="radio">
        <span class="pick-plate">SIGNAL LAB · MK II</span>
        <span class="pick-name">The Radio Room</span>
        <span class="pick-desc">Phosphor screens, toggle switches and valve glow.</span>
        <span class="pick-leds"><i></i><i></i><i></i></span>
      </button>
    </div>
  </div>

  <div id="flash" class="flash" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="detective">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cryptex</title>
  <meta name="description" content="A cipher and signals kit: Caesar, Vigenère, Enigma, Morse, light-beam Morse, SSTV, sound paper and more.">
  <meta name="theme-color" content="#1d150f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/about.css">
</head>
<body>
  <div id="app">
    <header class="appbar">
      <button class="icon-btn" id="back" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 class="appbar-title" id="bar-title"><span class="wordmark">CRYPTEX</span></h1>
      <span class="status-led" aria-hidden="true"></span>
      <button class="icon-btn" id="theme-btn" aria-label="Switch interface style" title="Switch interface style">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="bottomnav" aria-label="Main">
      <a href="#/" data-nav="home"><span class="nav-pill"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span><span data-label="home">Tools</span></a>
      <a href="#/about" data-nav="about"><span class="nav-pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><span data-label="about">Developer</span></a>
      <a href="#/settings" data-nav="settings"><span class="nav-pill"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span><span data-label="settings">Settings</span></a>
    </nav>
  </div>

  <div id="picker" class="picker" hidden>
    <div class="picker-inner">
      <img class="picker-mark" src="assets/icon-192.png" alt="">
      <h1 class="picker-title">Welcome to Cryptex</h1>
      <p class="picker-sub">Choose an interface. You can change it any time in Settings.</p>
      <button class="pick" data-pick="detective">
        <span class="tc-preview tc-detective"><i></i></span>
        <span><span class="pick-name">The Detective's Desk</span><span class="pick-desc">Paper case files, book type and ink.</span></span>
      </button>
      <button class="pick" data-pick="radio">
        <span class="tc-preview tc-radio"><i></i></span>
        <span><span class="pick-name">The Radio Room</span><span class="pick-desc">Instrument panels and phosphor screens.</span></span>
      </button>
    </div>
  </div>

  <div id="splash" class="splash" hidden></div>
  <div id="flash" class="flash" hidden data-nosfx></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
